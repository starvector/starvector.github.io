<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="45" ry="8" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Apple body -->
  <path d="M 100 50 
           C 70 50, 50 70, 50 100
           C 50 130, 60 150, 80 160
           C 90 165, 110 165, 120 160
           C 140 150, 150 130, 150 100
           C 150 70, 130 50, 100 50 Z" 
        fill="url(#appleGradient)"/>
  
  <!-- Highlight on apple -->
  <ellipse cx="80" cy="80" rx="25" ry="35" fill="rgba(255,200,150,0.3)" opacity="0.6"/>
  
  <!-- Stem -->
  <path d="M 100 50 Q 105 35, 115 30" 
        stroke="#5C3A31" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Leaf -->
  <ellipse cx="115" cy="35" rx="20" ry="12" 
           fill="url(#leafGradient)" 
           transform="rotate(-30 115 35)"/>
  
  <!-- Leaf vein -->
  <line x1="115" y1="35" x2="125" y2="35" 
        stroke="#7FA04C" 
        stroke-width="1" 
        opacity="0.5"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B4A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E84C3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C44133;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E8C2E;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>